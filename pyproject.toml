[project]
name = "weathercloud"
version = "0.1.0"
description = "Plot monthly rainfall from Weathercloud CSV exports"
requires-python = ">=3.12"
dependencies = [
    "matplotlib>=3.11.2",
]

[project.scripts]
plot-rainfall = "weathercloud.plot_rainfall:main"

[build-system]
requires = ["uv_build>=0.11.20,<0.12.0"]
build-backend = "uv_build"
