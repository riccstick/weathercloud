name: Build and publish weather dashboard

on:
  push:
    branches:
      - main
    paths:
      - "data/**"
      - "src/weathercloud/**"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/publish-pages.yml"
      - ".github/workflows/collect-weathercloud.yml"
  workflow_run:
    workflows:
      - Collect Weathercloud observations
    types:
      - completed
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out the latest main branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          sparse-checkout: |
            data
            src/weathercloud
            pyproject.toml
            uv.lock

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Install uv and Python
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Install project dependencies
        run: uv sync --frozen

      - name: Generate the interactive dashboard
        run: uv run --frozen build-rainfall-dashboard --data-dir data --output-dir site

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: site

  deploy:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
