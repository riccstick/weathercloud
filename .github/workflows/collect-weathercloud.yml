name: Collect Weathercloud observations

on:
  schedule:
    - cron: "3,13,23,33,43,53 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: collect-weathercloud-observations
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      WEATHERCLOUD_STATION_ID: d7978634673
    steps:
      - name: Check out the default branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: |
            data/weathercloud-observations
            src/weathercloud

      - name: Install uv and Python
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Install project dependencies
        run: uv sync --frozen

      - name: Collect the latest observation
        run: uv run --frozen update-rainfall

      - name: Commit a new observation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/weathercloud-observations/
          if git diff --cached --quiet; then
            echo "No new Weathercloud observation to commit."
            exit 0
          fi
          git commit -m "data: collect Weathercloud observation"
          git push origin HEAD
